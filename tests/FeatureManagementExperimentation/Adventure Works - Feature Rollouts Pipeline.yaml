pipeline:
  name: Adventure Works - Feature Rollout
  identifier: Adventure_Works_Feature_Rollout_v3
  projectIdentifier: lena_playground
  orgIdentifier: default
  tags: {}
  variables:
    - name: fme_feature_flag_name
      type: String
      description: This is a Harness CD pipeline example that demonstrates the orchestration of a safe, measured feature release. The pipeline uses Harness FME steps to run a feature beta release, canary release with experimentation support, and a monitored gradual rollout. FME steps also manage the feature flag life cycle.
      required: true
      value: display_product_rating
    - name: fme_environment
      type: String
      description: ""
      required: true
      value: Production-Env
  stages:
    - stage:
        name: Dark Deploy Feature
        identifier: Dark_Deploy_Feature
        description: This stage deploys application code to production (deploys a Canary instance and promotes to Rolling upon approval). After this stage completes, your feature is in production code, but it is behind an FME feature flag (the flag targeting rules should serve 'off'), this means your feature is not visible to end users.
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: PipelineRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: canary_service
            failureStrategies:
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: PipelineRollback
          environment:
            environmentRef: canary_environment
            deployToAll: false
            infrastructureDefinitions:
              - identifier: canary_infrastructure
          execution:
            steps:
              - step:
                  name: Canary Deployment
                  identifier: Canary_Deploy_Step
                  type: K8sCanaryDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    instanceSelection:
                      type: Count
                      spec:
                        count: 1
              - step:
                  name: Canary Delete
                  identifier: Canary_Delete_Step
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
              - step:
                  name: Primary Rolling Deployment
                  identifier: Rolling_Deploy_Step
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps: []
        tags: {}
    - stage:
        name: Rollout Feature
        identifier: Rollout_Feature
        description: This stage uses FME steps to perform a feature beta release, canary release, and gradual rollout. The canary release and gradual rollout step groups set up the flag for experimentation and monitoring, which allows you to roll out safely.
        type: Custom
        spec:
          execution:
            steps:
              - stepGroup:
                  name: Set Individual Targets
                  identifier: Set_Individual_Targets
                  steps:
                    - step:
                        type: FmeFlagUpdate
                        name: Set Flag Status to External Beta
                        identifier: Set_Flag_Status_to_External_Beta
                        spec:
                          name: <+pipeline.variables.fme_feature_flag_name>
                          rolloutStatus: External Beta
                          addDefaultRolloutPlans: true
                    - step:
                        type: FmeFlagSetIndividualTargets
                        name: Set a0 a1 a2 and a3 targets
                        identifier: Set_a0_a1_a2_a3_and_a4_targets
                        spec:
                          flagName: <+pipeline.variables.fme_feature_flag_name>
                          environment: <+pipeline.variables.fme_environment>
                          treatments:
                            - treatment: black
                              keys:
                                - a0
                              segments: []
                            - treatment: darkorange
                              keys:
                                - a1
                              segments: []
                            - treatment: goldenrod
                              keys:
                                - a2
                              segments: []
                            - treatment: "off"
                              keys:
                                - a3
                              segments: []
              - step:
                  type: HarnessApproval
                  name: Validate Feature Variations in Production
                  identifier: Validate_Feature_Variations_in_Production
                  spec:
                    approvalMessage: |-
                      Please review the following information and approve the pipeline progression:

                      Approve once you confirm that all feature flag treatments run correctly in production.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - account.FME_Pipeline_Approvers
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
                  timeout: 1w 3d
              - stepGroup:
                  name: Set Up Experiment
                  identifier: Set_Up_Experiment
                  steps:
                    - step:
                        type: FmeFlagUpdate
                        name: Set Flag Status to Experimenting
                        identifier: Set_Flag_Status_to_Experimenting
                        spec:
                          name: <+pipeline.variables.fme_feature_flag_name>
                          rolloutStatus: Experimenting
                          addDefaultRolloutPlans: true
                    - step:
                        type: FmeFlagLimitExposure
                        name: Limit Flag Exposure
                        identifier: Limit_Flag_Exposure
                        spec:
                          flagName: <+pipeline.variables.fme_feature_flag_name>
                          environment: <+pipeline.variables.fme_environment>
                          limit: 20
                    - step:
                        type: FmeFlagDefaultAllocation
                        name: Run Experiment
                        identifier: Run_Experiment
                        spec:
                          flagName: <+pipeline.variables.fme_feature_flag_name>
                          environment: <+pipeline.variables.fme_environment>
                          allocation:
                            - treatment: goldenrod
                              amount: 25
                            - treatment: darkorange
                              amount: 25
                            - treatment: black
                              amount: 25
                            - treatment: "off"
                              amount: 25
              - step:
                  type: Wait
                  name: wait 2 days
                  identifier: pause_60s_3
                  spec:
                    duration: 30s
              - stepGroup:
                  name: Complete Experiment
                  identifier: Complete_Experiment
                  steps:
                    - step:
                        type: HarnessApproval
                        name: Choose Flag Variant Based on Experiment Results
                        identifier: Choose_Flag_Variant_Based_on_Experiment_Results
                        spec:
                          approvalMessage: |-
                            As manual approver, please take the following steps:
                            1. Review experiment results.
                            2. Take special note of key and guardrail metric results.
                            3. Choose the feature flag variation that should remain in production. (You must choose only one feature flag treatment.)

                            https://app.harness.io/ng/account/4lpFbH_aSFWJZkukMM4P4A/module/fme/orgs/default/projects/lena_playground/org/472cebe0-e5ab-11f0-a297-526ddf23eb97/ws/ea636120-faed-11f0-9626-0a1527d0f26c/experiments/01KJ3B71Q2KB0DVZHXBHWMZJG3
                          includePipelineExecutionHistory: true
                          isAutoRejectEnabled: false
                          approvers:
                            userGroups:
                              - account.FME_Pipeline_Approvers
                            minimumCount: 1
                            disallowPipelineExecutor: false
                          approverInputs:
                            - name: approved_flag_treatment
                              defaultValue: ""
                              required: true
                              selectOneFrom: black,darkorange,goldenrod
                        timeout: 4d
                        failureStrategies:
                          - onFailure:
                              errors:
                                - ApprovalRejection
                              action:
                                type: MarkAsFailure
                    - parallel:
                        - step:
                            type: FmeFlagPatchDefinition
                            name: Set Chosen Flag Variant - black
                            identifier: Set_Chosen_Flag_Variant_black
                            spec:
                              flagName: <+pipeline.variables.fme_feature_flag_name>
                              environment: <+pipeline.variables.fme_environment>
                              operations: |-
                                [
                                    {
                                        "op"   : "replace", 
                                        "path" : "/defaultRule",
                                        "value": 
                                        [
                                            {"treatment": "black"     ,"size": 95},
                                            {"treatment": "darkorange","size": 0 },
                                            {"treatment": "goldenrod" ,"size": 0 },
                                            {"treatment": "off"       ,"size": 5 }
                                        ]
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/0/keys/0"
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/1/keys/0"
                                    },
                                    {
                                        "op"  : "remove",
                                        "path": "/treatments/2/keys/0"
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/3/keys/0"
                                    }
                                ]
                              inputVariables:
                                - name: approved_flag_treatment
                                  type: String
                                  value: <+execution.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment>
                            when:
                              stageStatus: Success
                              condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> == "black"
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: Abort
                          contextType: Pipeline
                        - step:
                            type: FmeFlagPatchDefinition
                            name: Set Chosen Flag Variant - darkorange
                            identifier: Set_Chosen_Flag_Variant_darkorange
                            spec:
                              flagName: <+pipeline.variables.fme_feature_flag_name>
                              environment: <+pipeline.variables.fme_environment>
                              operations: |-
                                [
                                    {
                                        "op"   : "replace", 
                                        "path" : "/defaultRule",
                                        "value": 
                                        [
                                            {"treatment": "black"     ,"size": 0 },
                                            {"treatment": "darkorange","size": 95},
                                            {"treatment": "goldenrod" ,"size": 0 },
                                            {"treatment": "off"       ,"size": 5 }
                                        ]
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/0/keys/0"
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/1/keys/0"
                                    },
                                    {
                                        "op"  : "remove",
                                        "path": "/treatments/2/keys/0"
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/3/keys/0"
                                    }
                                ]
                              inputVariables:
                                - name: approved_flag_treatment
                                  type: String
                                  value: <+execution.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment>
                            when:
                              stageStatus: Success
                              condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> == "darkorange"
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: Abort
                          contextType: Pipeline
                        - step:
                            type: FmeFlagPatchDefinition
                            name: Set Chosen Flag Variant - goldenrod
                            identifier: Set_Chosen_Flag_Variant_goldenrod
                            spec:
                              flagName: <+pipeline.variables.fme_feature_flag_name>
                              environment: <+pipeline.variables.fme_environment>
                              operations: |-
                                [
                                    {
                                        "op"   : "replace", 
                                        "path" : "/defaultRule",
                                        "value": 
                                        [
                                            {"treatment": "black"     ,"size": 0 },
                                            {"treatment": "darkorange","size": 0 },
                                            {"treatment": "goldenrod" ,"size": 95},
                                            {"treatment": "off"       ,"size": 5 }
                                        ]
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/0/keys/0"
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/1/keys/0"
                                    },
                                    {
                                        "op"  : "remove",
                                        "path": "/treatments/2/keys/0"
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/3/keys/0"
                                    }
                                ]
                              inputVariables:
                                - name: approved_flag_treatment
                                  type: String
                                  value: <+execution.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment>
                            when:
                              stageStatus: Success
                              condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> == "goldenrod"
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: Abort
                          contextType: Pipeline
                        - step:
                            type: FmeFlagPatchDefinition
                            name: Set Chosen Flag Variant - off
                            identifier: Set_Chosen_Flag_Variant_off
                            spec:
                              flagName: <+pipeline.variables.fme_feature_flag_name>
                              environment: <+pipeline.variables.fme_environment>
                              operations: |-
                                [
                                    {
                                        "op"   : "replace", 
                                        "path" : "/defaultRule",
                                        "value": 
                                        [
                                            {"treatment": "goldenrod" ,"size": 0  },
                                            {"treatment": "darkorange","size": 0  },
                                            {"treatment": "black"     ,"size": 0  },
                                            {"treatment": "off"       ,"size": 100}
                                        ]
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/0/keys/0"
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/1/keys/0"
                                    },
                                    {
                                        "op"  : "remove",
                                        "path": "/treatments/2/keys/0"
                                    },
                                    {
                                        "op"  : "remove", 
                                        "path": "/treatments/3/keys/0"
                                    }
                                ]
                              inputVariables:
                                - name: approved_flag_treatment
                                  type: String
                                  value: <+execution.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment>
                            when:
                              stageStatus: Failure
                            failureStrategies:
                              - onFailure:
                                  errors:
                                    - AllErrors
                                  action:
                                    type: Abort
                          contextType: Pipeline
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Abort
              - step:
                  type: Wait
                  name: pause 10s
                  identifier: pause_10s_4
                  spec:
                    duration: 10s
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> != "off"
              - stepGroup:
                  name: Complete Feature Rollout
                  identifier: Complete_Feature_Rollout
                  steps:
                    - step:
                        type: FmeFlagUpdate
                        name: Set Flag Status to Ramping
                        identifier: Set_Flag_Status_to_Ramping
                        spec:
                          name: <+pipeline.variables.fme_feature_flag_name>
                          rolloutStatus: Ramping
                          addDefaultRolloutPlans: true
                    - step:
                        type: FmeFlagLimitExposure
                        name: Roll Out to 30 Percent
                        identifier: Rollout_to_30_Percent
                        spec:
                          flagName: <+pipeline.variables.fme_feature_flag_name>
                          environment: <+pipeline.variables.fme_environment>
                          limit: 32
                    - step:
                        type: Wait
                        name: pause 10s .
                        identifier: pause_10s_5
                        spec:
                          duration: 10s
                    - step:
                        type: FmeFlagLimitExposure
                        name: Roll Out to 50 Percent
                        identifier: Rollout_to_50_Percent_ha
                        spec:
                          flagName: <+pipeline.variables.fme_feature_flag_name>
                          environment: <+pipeline.variables.fme_environment>
                          limit: 53
                        enforce:
                          policySets:
                            - Pipeline_Step_Policy_Custom_entity_type_On_Step
                    - step:
                        type: Wait
                        name: pause 30s ..
                        identifier: pause_10s_6
                        spec:
                          duration: 30s
                    - step:
                        type: FmeFlagLimitExposure
                        name: Roll Out to 75 Percent
                        identifier: Roll_Out_to_75_Percent
                        spec:
                          flagName: <+pipeline.variables.fme_feature_flag_name>
                          environment: <+pipeline.variables.fme_environment>
                          limit: 79
                    - step:
                        type: Wait
                        name: pause 30s ...
                        identifier: pause_10s_7
                        spec:
                          duration: 30s
                    - step:
                        type: FmeFlagLimitExposure
                        name: Roll Out to 95 Percent
                        identifier: Roll_Out_to_95_Percent
                        spec:
                          flagName: <+pipeline.variables.fme_feature_flag_name>
                          environment: <+pipeline.variables.fme_environment>
                          limit: 100
                    - stepGroup:
                        name: Roll Out to 100 Percent and Remove Baseline Comparison
                        identifier: Roll_Out_to_100_Percent_sg
                        steps:
                          - parallel:
                              - step:
                                  type: FmeFlagPatchDefinition
                                  name: Roll Out to 100 Percent - black
                                  identifier: Roll_Out_to_100_Percent_black
                                  spec:
                                    flagName: <+pipeline.variables.fme_feature_flag_name>
                                    environment: <+pipeline.variables.fme_environment>
                                    operations: |-
                                      [
                                          {
                                              "op"   : "replace", 
                                              "path" : "/defaultRule",
                                              "value": 
                                              [
                                                  {"treatment": "black"     ,"size": 100},
                                                  {"treatment": "darkorange","size": 0  },
                                                  {"treatment": "goldenrod" ,"size": 0  },
                                                  {"treatment": "off"       ,"size": 0  }
                                              ]
                                          }
                                      ]
                                    inputVariables: []
                                  when:
                                    stageStatus: Success
                                    condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> == "black"
                              - step:
                                  type: FmeFlagPatchDefinition
                                  name: Roll Out to 100 Percent - darkorange
                                  identifier: Roll_Out_to_100_Percent_darkorange
                                  spec:
                                    flagName: <+pipeline.variables.fme_feature_flag_name>
                                    environment: <+pipeline.variables.fme_environment>
                                    operations: |-
                                      [
                                          {
                                              "op"   : "replace", 
                                              "path" : "/defaultRule",
                                              "value": 
                                              [
                                                  {"treatment": "black"     ,"size": 0  },
                                                  {"treatment": "darkorange","size": 100},
                                                  {"treatment": "goldenrod" ,"size": 0  },
                                                  {"treatment": "off"       ,"size": 0  }
                                              ]
                                          }
                                      ]
                                    inputVariables: []
                                  when:
                                    stageStatus: Success
                                    condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> == "darkorange"
                              - step:
                                  type: FmeFlagPatchDefinition
                                  name: Roll Out to 100 Percent - goldenrod
                                  identifier: Roll_Out_to_100_Percent_goldenrod
                                  spec:
                                    flagName: <+pipeline.variables.fme_feature_flag_name>
                                    environment: <+pipeline.variables.fme_environment>
                                    operations: |-
                                      [
                                          {
                                              "op"   : "replace", 
                                              "path" : "/defaultRule",
                                              "value": 
                                              [
                                                  {"treatment": "black"     ,"size": 0  },
                                                  {"treatment": "darkorange","size": 0  },
                                                  {"treatment": "goldenrod" ,"size": 100},
                                                  {"treatment": "off"       ,"size": 0  }
                                              ]
                                          }
                                      ]
                                    inputVariables: []
                                  when:
                                    stageStatus: Success
                                    condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> == "goldenrod"
                    - step:
                        type: FmeFlagUpdate
                        name: Set Flag Status to Released
                        identifier: Set_Flag_Status_to_Released
                        spec:
                          name: <+pipeline.variables.fme_feature_flag_name>
                          rolloutStatus: 100% Released
                          addDefaultRolloutPlans: true
                      contextType: Pipeline
                  failureStrategies:
                    - onFailure:
                        errors:
                          - PolicyEvaluationFailure
                        action:
                          type: Abort
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> != "off"
        tags: {}
    - stage:
        name: Automated Flag Cleanup
        identifier: Automated_Flag_Cleanup
        description: ""
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Create flag removal ticket
                  identifier: Create_flag_removal_ticket
                  type: JiraCreate
                  timeout: 5m
                  spec:
                    connectorRef: connectorRef
                    projectKey: project
                    issueType: Task
                    fields: []
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - stepGroup:
                  name: container based execution
                  identifier: container_based_execution
                  steps:
                    - step:
                        type: Agent
                        name: Feature Flag Cleanup
                        identifier: Feature_Flag_Cleanup
                        spec:
                          agentName: featureFlagCleanupAgent
                          agentSettings:
                            repo: ""
                            treatment: <+pipeline.stages.Rollout_Feature.spec.execution.steps.Complete_Experiment.steps.Set_Chosen_Flag_Variant_black.spec.inputVariables.approved_flag_treatment>
                            branch: harness_fme_rm_display_product_rating_flag
                            feature_flag: display_product_rating
              - step:
                  name: Wait for ticket to be DONE
                  identifier: Wait_for_ticket_to_be_DONE
                  type: JiraApproval
                  timeout: 1d
                  spec:
                    connectorRef: connectorRef
                    issueKey: PROJ-123
                    issueType: Task
                    projectKey: project
                    approvalCriteria:
                      type: KeyValues
                      spec:
                        matchAnyCondition: false
                        conditions:
                          - key: Status
                            operator: equals
                            value: Done
                    rejectionCriteria:
                      type: KeyValues
                      spec:
                        matchAnyCondition: false
                        conditions: []
                    retryInterval: 1m
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
              - step:
                  name: Close Jira ticket
                  identifier: Close_Jira_ticket
                  type: JiraUpdate
                  timeout: 5m
                  spec:
                    connectorRef: JIRA_connector
                    issueKey: PROJ-123
                    fields: []
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: MarkAsSuccess
        tags: {}
    - stage:
        name: Clean Deploy Feature
        identifier: Clean_Deploy_Feature
        description: This stage canary-deploys the chosen feature variation to production, with the flag evaluation code removed. After this stage, production code no longer evaluates the feature flag.
        type: Deployment
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: PipelineRollback
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: canary_service
            failureStrategies:
              - onFailure:
                  errors:
                    - AllErrors
                  action:
                    type: PipelineRollback
          environment:
            environmentRef: canary_environment
            deployToAll: false
            infrastructureDefinitions:
              - identifier: canary_infrastructure
          execution:
            steps:
              - step:
                  name: Canary Deployment
                  identifier: Canary_Deploy_Step
                  type: K8sCanaryDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    instanceSelection:
                      type: Count
                      spec:
                        count: 1
              - step:
                  name: Canary Delete
                  identifier: Canary_Delete_Step
                  type: K8sCanaryDelete
                  timeout: 10m
                  spec: {}
              - step:
                  name: Primary Rolling Deployment
                  identifier: Rolling_Deploy_Step
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps: []
        tags: {}
    - stage:
        name: Archive Feature Flag
        identifier: Archive_Feature_Flag
        description: This stage completes the FME flag lifecycle in Harness.
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: FmeFlagUpdate
                  name: Set Flag Status to Removed From Code
                  identifier: Set_Flag_Status_to_Removed_From_Code
                  spec:
                    name: <+pipeline.variables.fme_feature_flag_name>
                    rolloutStatus: Removed from Code
                    addDefaultRolloutPlans: true
                contextType: Pipeline
              - step:
                  type: Wait
                  name: pause 10s ... ..
                  identifier: pause_10s_9
                  spec:
                    duration: 10s
                contextType: Pipeline
              - step:
                  type: FmeFlagKill
                  name: Kill Feature Flag
                  identifier: Kill_Feature_Flag
                  spec:
                    flagName: <+pipeline.variables.fme_feature_flag_name>
                    environment: <+pipeline.variables.fme_environment>
                  failureStrategies:
                    - onFailure:
                        errors:
                          - Unknown
                        action:
                          type: MarkAsSuccess
              - step:
                  type: Wait
                  name: pause 10s ... ...
                  identifier: pause_10s_
                  spec:
                    duration: 10s
              - step:
                  type: FmeFlagArchive
                  name: Archive Flag
                  identifier: Archive_Flag
                  spec:
                    name: display_product_rating
            when:
              stageStatus: Success
              condition: <+execution.steps.Complete_Experiment.steps.Choose_Flag_Variant_Based_on_Experiment_Results.output.approverInputs.approved_flag_treatment> != "off"
        tags: {}
  allowStageExecutions: true
